site_name: ViewState Docs
site_description: Documentação oficial do ViewState
site_author: ViewState360
site_url: https://viewstate360.github.io/viewstate-docs/

repo_name: ViewState360/viewstate-docs
repo_url: https://github.com/ViewState360/viewstate-docs
edit_uri: edit/main/docs/

copyright: Copyright &copy; ViewState360

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro

plugins:
  - search:
      lang: pt

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - Começando:
      - Instalação: comecando/instalacao.md
      - Primeiros passos: comecando/primeiros-passos.md
  - Guias:
      - Configuração: guias/configuracao.md
  - Referência:
      - API: referencia/api.md
  - FAQ: faq.md
  - Contribuindo: contribuindo.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ViewState360
      name: ViewState360 no GitHub

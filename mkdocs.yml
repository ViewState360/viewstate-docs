site_name: ViewState
site_description: Marca e design system do ViewState
site_author: ViewState360
site_url: https://viewstate360.github.io/viewstate-docs/

repo_name: ViewState360/viewstate-docs
repo_url: https://github.com/ViewState360/viewstate-docs
edit_uri: edit/main/docs/

copyright: ViewState — Visão que transforma espaços.

theme:
  name: material
  language: pt-BR
  logo: assets/marca/simbolo-claro.png
  favicon: assets/marca/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Marca:
      - Logo: marca/logo.md
      - Cores: marca/cores.md
  - Design System:
      - Tipografia: design-system/tipografia.md
      - Fundações: design-system/fundacoes.md
      - Componentes: design-system/componentes.md
      - Feedback e overlays: design-system/feedback.md
      - Apresentação de dados: design-system/dados.md
      - Navegação: design-system/navegacao.md
  - Contribuindo: contribuindo.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ViewState360
      name: ViewState360 no GitHub
